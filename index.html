const num=n=>(Math.round((n||0)*100)/100).toLocaleString("ru-RU").replace(/[  ]/g," ");
const parseNum=v=>{const x=parseFloat(String(v||"").replace(/\s/g,"").replace(",","."));return isFinite(x)?x:0;};

// ---------- calculations ----------
function stockOf(pid){let q=0;for(const o of S.ops){if(o.productId!==pid)continue;if(o.type==="purchase")q+=o.qty||0;else if(o.type==="sale")q-=o.qty||0;}return q;}
function avgCost(pid){let q=0,c=0;for(const o of S.ops){if(o.type==="purchase"&&o.productId===pid){q+=o.qty||0;c+=(o.qty||0)*(o.price||0);}}if(q>0)return c/q;const p=S.products.find(x=>x.id===pid);return p?(p.buyPrice||0):0;}
function opAmount(o){return o.type==="sale"||o.type==="purchase"?(o.qty||0)*(o.price||0):o.type==="cash_adj"?(o.cash||0)+(o.card||0):(o.amount||0);}
function moneyNow(){let cash=0,card=0;for(const o of S.ops){const c=o.method?(o.cash||0):(o.amount||0),k=o.method?(o.card||0):0;
  if(o.type==="pay_in"){cash+=c;card+=k;}else if(o.type==="pay_out"||o.type==="expense"){cash-=c;card-=k;}else if(o.type==="cash_adj"){cash+=o.cash||0;card+=o.card||0;}}
  return{cash,card,total:cash+card};}
const addDays=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return iso(x);};
const daysBetween=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
function dueInfo(pid){const items=S.ops.filter(o=>o.partyId===pid&&(o.type==="sale"||o.type==="debt_they")).sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.createdAt||0)-(b.createdAt||0));
  let paid=S.ops.filter(o=>o.partyId===pid&&o.type==="pay_in").reduce((a,o)=>a+(o.amount||0),0);const open=[];
  for(const it of items){const amt=opAmount(it);const use=Math.min(paid,amt);paid-=use;const left=amt-use;if(left>0.5)open.push({left,due:it.dueDate||"",date:it.date});}
  const dated=open.filter(x=>x.due).sort((a,b)=>a.due.localeCompare(b.due));const t=today();
  const overdue=dated.filter(x=>x.due<t).reduce((a,x)=>a+x.left,0);const next=dated[0]||null;
  return{open,next,overdue,days:next?daysBetween(t,next.due):null};}
function dueLabel(days){return days<0?"срок прошёл "+(-days)+" "+plural(-days,"день","дня","дней")+" назад":days===0?"срок сегодня":days===1?"срок завтра":"срок через "+days+" "+plural(days,"день","дня","дней");}
function duePill(pid){const d=dueInfo(pid);if(d.days==null)return"";const cls=d.days<0?"bad":d.days<=2?"warn":"";return ' <span class="pill '+cls+'">'+(d.days<0?"просрочен":"до "+fmtDate(d.next.due).slice(0,5))+'</span>';}
function alerts(){const t=today();return S.parties.filter(p=>p.kind!=="supplier").map(p=>({p,d:dueInfo(p.id),debt:partyStats(p.id).debt})).filter(r=>r.debt>0.5&&r.d.days!=null&&r.d.days<=2).map(r=>{const lim=r.d.days<=0?today():r.d.next.due;r.due=Math.min(r.debt,r.d.open.filter(x=>x.due&&x.due<=lim).reduce((a,x)=>a+x.left,0));return r;}).sort((a,b)=>a.d.days-b.d.days);}
function balanceOf(pid){let b=0;for(const o of S.ops){if(o.partyId!==pid)continue;const a=opAmount(o);
  if(o.type==="sale"||o.type==="debt_they"||o.type==="pay_out")b+=a;else if(o.type==="pay_in"||o.type==="purchase"||o.type==="debt_me")b-=a;}return b;}
function lastActivity(pid){let d="";for(const o of S.ops)if(o.partyId===pid&&o.date>d)d=o.date;return d;}
function totals(){let owedToMe=0,iOwe=0,debtors=0,creditors=0;for(const p of S.parties){const b=balanceOf(p.id);if(b>0.5){owedToMe+=b;debtors++;}else if(b<-0.5){iOwe+=-b;creditors++;}}
  let packs=0,stockValue=0,low=0;for(const p of S.products){const q=stockOf(p.id);packs+=q;stockValue+=Math.max(q,0)*avgCost(p.id);if((p.minStock||0)>0&&q<=p.minStock)low++;}
  return{owedToMe,iOwe,debtors,creditors,packs,stockValue,low};}
function periodRange(per){const d=new Date(),y=d.getFullYear(),m=d.getMonth();
  if(per==="today")return[today(),today()];if(per==="week"){const s=new Date(d);s.setDate(d.getDate()-6);return[iso(s),today()];}
  if(per==="month")return[iso(new Date(y,m,1)),today()];if(per==="prev")return[iso(new Date(y,m-1,1)),iso(new Date(y,m,0))];
  if(per==="year")return[iso(new Date(y,0,1)),today()];return["0000-00-00","9999-99-99"];}
function income(a,b){let inCash=0,inCard=0,revenue=0,cogs=0,expenses=0,cashIn=0,cashOut=0,packs=0;const byProd={},byExp={},byShop={};const shopRow=k=>byShop[k]=byShop[k]||{qty:0,rev:0,paid:0};
  for(const o of S.ops){if(!o.date||o.date<a||o.date>b)continue;
    if(o.type==="sale"){const r=(o.qty||0)*(o.price||0),c=(o.qty||0)*(o.cost!=null?o.cost:avgCost(o.productId));revenue+=r;cogs+=c;packs+=o.qty||0;const k=o.productId;byProd[k]=byProd[k]||{qty:0,rev:0,profit:0};byProd[k].qty+=o.qty||0;byProd[k].rev+=r;byProd[k].profit+=r-c;if(o.partyId){const sh=shopRow(o.partyId);sh.qty+=o.qty||0;sh.rev+=r;}}
    if(o.type==="expense"){expenses+=o.amount||0;const k=(o.note||"").trim()||"Без описания";byExp[k]=(byExp[k]||0)+(o.amount||0);}
    if(o.type==="pay_in"){cashIn+=o.amount||0;if(o.partyId)shopRow(o.partyId).paid+=o.amount||0;if(o.method){inCash+=o.cash||0;inCard+=o.card||0;}else inCash+=o.amount||0;}if(o.type==="pay_out"||o.type==="expense")cashOut+=o.amount||0;}
  return{inCash,inCard,a,b,revenue,cogs,gross:revenue-cogs,expenses,net:revenue-cogs-expenses,cashIn,cashOut,packs,byProd,byExp,byShop};}
const sortedOps=()=>S.ops.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0));
const sortedProducts=()=>S.products.slice().sort((a,b)=>(a.order||0)-(b.order||0)||a.name.localeCompare(b.name));

// ---------- charts ----------
function barChart(series, opts){ // series: [{label, values:[...]}], opts.colors
  const W=640,H=200,pl=8,pr=8,pt=14,pb=24;const n=series.length,k=series[0]?series[0].values.length:1;
  const max=Math.max(1,...series.flatMap(s=>s.values.map(v=>Math.abs(v))));
  const nice=(()=>{const p=Math.pow(10,Math.floor(Math.log10(max)));for(const m of[1,2,2.5,5,10])if(m*p>=max)return m*p;return 10*p;})();
  const minV=Math.min(0,...series.flatMap(s=>s.values));const lo=minV<0?-nice:0;const span=nice-lo;
  const y=v=>pt+(H-pt-pb)*(1-(v-lo)/span);const bw=(W-pl-pr)/n;const gap=Math.min(6,bw*.2);const inner=(bw-gap*2)/k;
  let g='';for(const t of[lo,(lo+nice)/2,nice]){if(lo<0&&t===(lo+nice)/2)continue;g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="var(--line)" stroke-dasharray="'+(t===0?"0":"3 4")+'"/>';g+='<text x="'+(W-pr)+'" y="'+(y(t)-4)+'" text-anchor="end">'+short(t)+'</text>';}
  if(lo<0)g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="var(--muted)" stroke-opacity=".5"/>';
  let bars='';series.forEach((s,i)=>{const x0=pl+i*bw+gap;s.values.forEach((v,j)=>{const y1=y(Math.max(v,0)),y2=y(Math.min(v,0));const h=Math.max(v?1.5:0,y2-y1);
    bars+='<rect x="'+(x0+j*inner+0.5).toFixed(1)+'" y="'+y1.toFixed(1)+'" width="'+Math.max(1,inner-1).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="'+Math.min(4,inner/3).toFixed(1)+'" fill="'+(v<0?"var(--bad)":opts.colors[j])+'"><title>'+esc(s.label)+': '+money(v)+'</title></rect>';});
    if(s.tick)bars+='<text x="'+(pl+i*bw+bw/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(s.tick)+'</text>';});
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.label)+'">'+g+bars+'</svg>';
}
function dailyChart(){const days=[];const d=new Date();for(let i=29;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-i);days.push(iso(x));}
  const rev={};for(const o of S.ops)if(o.type==="sale"&&o.date>=days[0])rev[o.date]=(rev[o.date]||0)+opAmount(o);
  const total=days.reduce((s,k)=>s+(rev[k]||0),0);
  const series=days.map((k,i)=>({label:fmtDate(k),values:[rev[k]||0],tick:(i%7===2||i===29)?k.slice(8)+" "+MON[+k.slice(5,7)-1]:""}));
  return{svg:barChart(series,{colors:["var(--accent)"],label:"Выручка по дням за 30 дней"}),total};}
function monthlyChart(){const d=new Date();const ms=[];for(let i=5;i>=0;i--){const s=new Date(d.getFullYear(),d.getMonth()-i,1),e=new Date(d.getFullYear(),d.getMonth()-i+1,0);ms.push([iso(s),iso(e),MON[s.getMonth()]]);}
  const series=ms.map(([a,b,l])=>{const r=income(a,b);return{label:l,values:[r.revenue,r.net],tick:l};});
  return barChart(series,{colors:["var(--accent2)","var(--good)"],label:"Выручка и чистая прибыль по месяцам"});}

  '<div class="seg" id="pm"><button type="button" data-m="cash" class="on">Наличные</button><button type="button" data-m="card">Перевод</button><button type="button" data-m="split">Раздельно</button></div>'+

function wirePay(f,onChange){const st={m:"cash"};
  $("#pm").addEventListener("click",e=>{const x=e.target.closest("[data-m]");if(!x)return;
    if(x.dataset.m==="split"&&st.m!=="split"){f.paidCash.value=st.m==="cash"?f.paid.value:"";f.paidCard.value=st.m==="card"?f.paid.value:"";}
    if(x.dataset.m!=="split"&&st.m==="split"){const t=parseNum(f.paidCash.value)+parseNum(f.paidCard.value);f.paid.value=t?Math.round(t):"";}
    st.m=x.dataset.m;document.querySelectorAll("#pm button").forEach(y=>y.classList.toggle("on",y===x));$("#pm1").hidden=st.m==="split";$("#pm2").hidden=st.m!=="split";onChange&&onChange();});
  for(const n of["paid","paidCash","paidCard"])f[n].addEventListener("input",()=>{st.touched=true;onChange&&onChange();});
  return{get(){if(st.m==="split"){const cash=parseNum(f.paidCash.value),card=parseNum(f.paidCard.value);return{amount:cash+card,cash,card,method:"split"};}
      const a=parseNum(f.paid.value);return{amount:a,cash:st.m==="cash"?a:0,card:st.m==="card"?a:0,method:st.m};},
    set(v){if(st.m==="split"){f.paidCash.value=v?Math.round(v):"";f.paidCard.value="";}else f.paid.value=v?Math.round(v):"";},
    get touched(){return !!st.touched;}};}

const mainSupplier=()=>S.parties.filter(p=>p.kind==="supplier").sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))[0];

  if(!isSale&&!preParty){const ms=mainSupplier();if(ms)preParty=ms.id;}

   '<label>'+(isSale?"Магазин":"Поставщик")+'<select name="party">'+partyOptions(isSale?"client":"supplier",preParty||"",isSale?"Без магазина (розница)":"Без поставщика (начальный остаток)")+'</select></label>'+

   payHTML(isSale?"Магазин оплатил сейчас":"Я оплатил сейчас")+(isSale?'<label id="dueBox" hidden>Срок оплаты долга<input type="date" name="due" value="'+addDays(today(),7)+'"></label>':'')+

   '<div class="total" id="sum">Сумма: 0 сум</div><button class="pri" type="submit">Сохранить</button></form>',root=>{
    wireNewParty(root);const f=$("#f");let pay;
    const upd=()=>{const tot=parseNum(f.qty.value)*parseNum(f.price.value);if(pay&&!pay.touched)pay.set(isSale||!f.party.value?tot:0);const debt=tot-(pay?pay.get().amount:0);
      if(isSale)$("#dueBox").hidden=!(debt>0.5);$("#sum").innerHTML='Сумма: '+money(tot)+(debt>0.5&&(isSale||f.party.value)?' · <span class="bad">'+(isSale?"в долг ":"мой долг ")+money(debt)+'</span>':"");};
    pay=wirePay(f,upd);
    const fill=()=>{const p=S.products.find(x=>x.id===f.product.value);const pr=p&&(isSale?p.sellPrice:p.buyPrice);if(pr)f.price.value=pr;upd();};
    f.product.addEventListener("change",fill);f.qty.addEventListener("input",upd);f.price.addEventListener("input",upd);f.party.addEventListener("change",upd);fill();

function sheetPayment(preParty,preDir){
  if(!S.parties.length){toast("Сначала добавьте магазин или поставщика");sheetParty();return;}
  openSheet(sheetHead("Оплата долга")+'<form id="f"><div class="seg" id="dir"><button type="button" data-dir="in">Магазин оплатил мне</button><button type="button" data-dir="out">Я оплатил поставщику</button></div>'+
   '<label>Кто<select name="party" required></select></label><div class="hint" id="debtNow"></div>'+
   payHTML("Как оплатил")+'<div class="total" id="payLeft"></div>'+
   '<div class="grid2"><label>Дата<input type="date" name="date" value="'+today()+'"></label><label>Заметка<input name="note"></label></div>'+
   '<button class="pri" type="submit">Сохранить оплату</button></form>',()=>{
    const f=$("#f");const curDebt=()=>f.party.value?Math.max(0,partyStats(f.party.value).debt):0;
    const left=()=>{const d=curDebt(),a=pay.get().amount,el=$("#payLeft");if(!f.party.value){el.hidden=true;return;}el.hidden=false;
      el.innerHTML=a>d+0.5?'<span class="bad">Сумма больше долга на '+money(a-d)+'. Максимум '+money(d)+'</span>':a>0?'Останется долг: '+(d-a<0.5?'<span class="good">0 сум, долг закрыт</span>':money(d-a)):'Впишите сумму оплаты';
      const b=document.querySelector('#f button[type=submit]');if(b&&!saving)b.disabled=a>d+0.5;};
    const pay=wirePay(f,left);let lastEdited="";
    f.paidCash.addEventListener("input",()=>{lastEdited="cash";if(!f.paidCard.dataset.manual){const r=Math.max(0,curDebt()-parseNum(f.paidCash.value));f.paidCard.value=r?Math.round(r):"";}left();});
    f.paidCard.addEventListener("input",()=>{f.paidCard.dataset.manual=lastEdited==="cash"?"1":"";if(lastEdited!=="cash"){const r=Math.max(0,curDebt()-parseNum(f.paidCard.value));f.paidCash.value=r?Math.round(r):"";}left();});
    const pre=preParty?S.parties.find(p=>p.id===preParty):null;let dir=preDir||(pre&&pre.kind==="supplier"?"out":"in");
    const fillParties=sel=>{const sup=dir==="out";const list=S.parties.filter(p=>(p.kind==="supplier")===sup).sort((a,b)=>partyStats(b.id).debt-partyStats(a.id).debt);
      f.party.innerHTML=list.map(p=>{const d=partyStats(p.id).debt;return '<option value="'+p.id+'">'+esc(p.name)+(d>0.5?" (долг "+money(d)+")":"")+'</option>';}).join("")||'<option value="">'+(sup?"Нет поставщиков":"Нет магазинов")+'</option>';
      if(sel&&list.some(p=>p.id===sel))f.party.value=sel;showDebt();};
    const showDebt=()=>{const id=f.party.value;if(!id){$("#debtNow").textContent="";return;}const d=partyStats(id).debt;
      $("#debtNow").textContent=d>0.5?(dir==="out"?"Мой долг сейчас: ":"Долг магазина сейчас: ")+money(d):"Долга нет";if(!pay.touched)pay.set(d>0.5?d:0);left();};
    const paint=()=>document.querySelectorAll("#dir button").forEach(x=>x.classList.toggle("on",x.dataset.dir===dir));
    $("#dir").addEventListener("click",e=>{const x=e.target.closest("[data-dir]");if(x&&x.dataset.dir!==dir){dir=x.dataset.dir;paint();fillParties();}});
    f.party.addEventListener("change",showDebt);paint();fillParties(preParty);
    f.addEventListener("submit",e=>{e.preventDefault();save(async()=>{const pv=pay.get();if(!f.party.value)throw new Error("Выберите, кто.");if(pv.amount<=0)throw new Error("Укажите сумму.");
      const d=curDebt();if(d<0.5)throw new Error("Долга нет, оплату записывать не нужно.");if(pv.amount>d+0.5)throw new Error("Сумма больше долга. Максимум "+money(d)+".");

}

    const f=$("#f");f.kind.addEventListener("change",()=>{$("#shopPrices").hidden=f.kind.value==="supplier";});
    f.addEventListener("submit",e=>{e.preventDefault();save(async()=>{const data={name:f.name.value.trim(),kind:f.kind.value,phone:f.phone.value.trim(),addr:f.addr.value.trim()};if(!data.name)throw new Error("Впишите название.");
      if(data.kind!=="supplier"){const prices={...((p&&p.prices)||{})};for(const pr of S.products){const v=parseNum(f["sp_"+pr.id].value);if(v>0)prices[pr.id]=v;else delete prices[pr.id];}data.prices=prices;}
      if(p)await S.db.doc("parties/"+p.id).update(data);else await S.db.collection("parties").add({...data,createdAt:Date.now()});},"Сохранено");});
    const d=$("#delp");if(d)d.addEventListener("click",()=>{if(S.ops.some(o=>o.partyId===p.id)){toast("Есть записи. Сначала удалите их в журнале.");return;}confirmInline(d,"Точно удалить?",()=>save(()=>S.db.doc("parties/"+p.id).delete(),"Удалено"));});});
}
function sheetPartyCard(id){
  const p=S.parties.find(x=>x.id===id);if(!p)return;const sup=p.kind==="supplier";const st=partyStats(id);const ops=sortedOps().filter(o=>o.partyId===id);
  const pays=ops.filter(o=>o.type===(sup?"pay_out":"pay_in"));
  const remind=!sup&&st.debt>0.5?"Здравствуйте! Напоминаю, за магазином «"+p.name+"» долг "+money(st.debt)+" за подгузники Fairy Baby"+(dueInfo(id).next?", срок оплаты "+fmtDate(dueInfo(id).next.due):"")+". Когда сможете оплатить?":"";
  const tile=(l,v,c)=>'<div class="tile"><span class="l">'+l+'</span><span class="v '+(c||"")+'">'+v+'</span></div>';
  openSheet(sheetHead(esc(p.name))+'<span class="sub">'+(sup?"Поставщик":"Магазин")+(p.phone?' · '+esc(p.phone):"")+(p.addr?' · '+esc(p.addr):"")+'</span>'+
   '<div class="tiles" style="grid-template-columns:repeat(3,minmax(0,1fr))">'+tile(sup?"Закуплено":"Взял товара",money(st.goods+st.old))+tile(sup?"Я отдал":"Отдал",money(st.paid),"good")+
     tile(st.debt>=-0.5?(sup?"Мой долг":"В долгу"):"Переплата",money(Math.abs(st.debt)),st.debt>0.5?(sup?"bad":"warn"):"good")+'</div>'+
   (!sup&&st.debt>0.5?(()=>{const d=dueInfo(id);return d.next?'<div class="total '+(d.days<0?"bad":d.days<=2?"warn":"")+'">Срок оплаты: '+fmtDate(d.next.due)+' · '+dueLabel(d.days)+'</div>':'<div class="hint">Срок оплаты не указан.</div>';})():'')+
   '<div class="row"><button class="pri" id="pp">'+(sup?"Я оплатил":"Магазин оплатил")+'</button>'+(sup?'<button id="np">+ Приход от него</button>':'<button id="np">+ Отдал товар</button>')+'<button id="ep">Изменить</button></div>'+
   (remind?'<div class="card"><div class="row sb"><h2>Напоминание о долге</h2><button class="sm" id="cp">Скопировать</button></div><div class="copybox" id="rt">'+esc(remind)+'</div></div>':"")+
   (()=>{const gt=sup?"purchase":"sale";const g=ops.filter(o=>o.type===gt);if(!g.length)return"";const by={};for(const o of g){const k=o.productId;by[k]=by[k]||{q:0,s:0};by[k].q+=o.qty||0;by[k].s+=opAmount(o);}
     const rows=Object.entries(by).sort((a,b)=>b[1].q-a[1].q);const tq=rows.reduce((a,r)=>a+r[1].q,0);
     const dl={};for(const o of g){const k=o.batch||(o.date+"|"+(o.dueDate||""));dl[k]=dl[k]||{date:o.date,due:o.dueDate,q:0,s:0,items:[]};dl[k].q+=o.qty||0;dl[k].s+=opAmount(o);dl[k].items.push(prodName(o.productId).replace("Подгузники","П").replace("Трусики","Тр")+" × "+num(o.qty));}
     const dls=Object.values(dl).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
     return '<div class="card"><div class="row sb"><h2>'+(sup?"Что привозил":"Что брал")+' по размерам</h2><span class="sub">всего '+num(tq)+' пач.</span></div><div class="list">'+rows.map(([pid,x])=>'<div class="item"><div style="min-width:0"><div class="t">'+esc(prodName(pid))+'</div><div class="d">'+num(x.q)+' пач.</div></div><span class="r">'+money(x.s)+'</span></div>').join("")+'</div></div>'+
      '<div class="card"><div class="row sb"><h2>'+(sup?"Приходы":"Поставки")+'</h2><span class="sub">'+dls.length+'</span></div><div class="list">'+dls.map(d=>'<div class="item"><div style="min-width:0"><div class="t">'+fmtDate(d.date)+(d.due?' <span class="sub">· срок '+fmtDate(d.due)+'</span>':'')+'</div><div class="d">'+esc(d.items.join(", "))+'</div></div><span class="r">'+money(d.s)+'<div class="sub" style="text-align:right">'+num(d.q)+' пач.</div></span></div>').join("")+'</div></div>';})()+
   '<div class="card"><h2>Как закрывался долг</h2>'+(pays.length?'<div class="list">'+pays.map(o=>'<div class="item"><div><div class="t">'+fmtDate(o.date)+'</div><div class="d">'+esc(payDesc(o)||o.note||"оплата")+(o.method&&o.note?' · '+esc(o.note):'')+'</div></div><span class="r good">'+money(o.amount)+'</span></div>').join("")+'</div>':'<div class="hint">Оплат пока не было.</div>')+'</div>'+
   '<div class="card"><h2>Вся история</h2>'+(ops.length?'<div class="list">'+ops.map(o=>opRow(o,false)).join("")+'</div>':'<div class="hint">Записей нет.</div>')+'</div>',()=>{
    $("#pp").addEventListener("click",()=>sheetPayment(id,sup?"out":"in"));$("#ep").addEventListener("click",()=>sheetParty(id));
    $("#np").addEventListener("click",()=>sup?sheetBulkPurchase(id):sheetBulkSale(id));
    const c=$("#cp");if(c)c.addEventListener("click",()=>{const done=()=>toast("Текст скопирован");try{navigator.clipboard.writeText(remind).then(done,()=>{selectText($("#rt"));toast("Выделил текст, скопируйте его");});}catch(e){selectText($("#rt"));}});});
}
function selectText(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);}
function sheetProduct(id){
  const p=id?S.products.find(x=>x.id===id):null;
  openSheet(sheetHead(p?"Товар":"Новый товар")+'<form id="f"><label>Название<input name="name" required placeholder="Подгузники 3" value="'+esc(p?p.name:"")+'"></label>'+
   '<div class="grid2"><label>Цена закупки<input name="buy" inputmode="numeric" value="'+(p&&p.buyPrice?p.buyPrice:"")+'"></label><label>Цена продажи<input name="sell" inputmode="numeric" value="'+(p&&p.sellPrice?p.sellPrice:"")+'"></label></div>'+
   '<div class="grid2"><input type="hidden" name="pcs" value="'+(p&&p.pcs?p.pcs:"")+'"><label>Вес ребёнка<input name="weight" placeholder="6–11 кг" value="'+esc(p?p.weight:"")+'"></label></div><label>Напомнить «пора заказывать», когда останется (пачек)<input name="min" inputmode="numeric" value="'+(p&&p.minStock?p.minStock:"")+'"></label>'+
   (p?'<div class="total">Сейчас на складе: '+num(stockOf(p.id))+' пач.</div>':"")+
   '<button class="pri" type="submit">Сохранить</button>'+(p?'<button type="button" class="danger" id="delp">Удалить товар</button>':"")+'</form>',()=>{
    const f=$("#f");f.addEventListener("submit",e=>{e.preventDefault();save(async()=>{const data={name:f.name.value.trim(),buyPrice:parseNum(f.buy.value),sellPrice:parseNum(f.sell.value),minStock:parseNum(f.min.value),pcs:parseNum(f.pcs.value),weight:f.weight.value.trim()};if(!data.name)throw new Error("Впишите название.");
      if(p)await S.db.doc("products/"+p.id).update(data);else await S.db.collection("products").add({...data,order:S.products.length,createdAt:Date.now()});},"Товар сохранён");});
    const d=$("#delp");if(d)d.addEventListener("click",()=>{if(S.ops.some(o=>o.productId===p.id)){toast("По товару есть записи. Сначала удалите их в журнале.");return;}confirmInline(d,"Точно удалить товар?",()=>save(()=>S.db.doc("products/"+p.id).delete(),"Товар удалён"));});});
}
function confirmInline(btn,text,yes){const w=document.createElement("div");w.className="row";w.innerHTML='<span class="bad" style="font-weight:800">'+esc(text)+'</span><button type="button" class="danger sm">Да, удалить</button><button type="button" class="sm">Отмена</button>';
  btn.replaceWith(w);const[y,n]=w.querySelectorAll("button");y.addEventListener("click",yes);n.addEventListener("click",()=>w.replaceWith(btn));}
let saving=false;
async function save(fn,ok){if(saving)return;saving=true;const btn=document.querySelector("#f button[type=submit]");if(btn){btn.disabled=true;btn.dataset.t=btn.textContent;btn.textContent="Сохраняю…";}
  try{await fn();closeSheet();toast(ok);}catch(e){if(btn){btn.disabled=false;btn.textContent=btn.dataset.t;}toast(e&&e.code==="permission_denied"?"Нет прав на запись":(e&&e.message)||"Не удалось сохранить");}finally{saving=false;}}
const SIZES=[["Подгузники 1",32,"до 5 кг"],["Подгузники 2",56,"4–8 кг"],["Подгузники 3",50,"6–11 кг"],["Подгузники 4",42,"9–12 кг"],["Подгузники 5",40,"12–17 кг"],["Подгузники 6",38,"от 15 кг"],["Трусики 3",44,"6–11 кг"],["Трусики 4",42,"9–14 кг"],["Трусики 5",40,"12–17 кг"],["Трусики 6",38,"от 15 кг"],["Трусики 7",36,"от 18 кг"]];
async function seedProducts(){await save(async()=>{let i=0;for(const [name,pcs,weight] of SIZES)await S.db.collection("products").add({name,pcs,weight,buyPrice:0,sellPrice:0,minStock:0,order:i++,createdAt:Date.now()});},"Размеры добавлены, впишите цены");}

// ---------- events ----------
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-act],[data-prod],[data-party],[data-period],[data-filter],[data-del]");if(!t)return;
  if(t.dataset.tab){if(S.tab!==t.dataset.tab)S.q="";S.tab=t.dataset.tab;closeSheetSilently();render();window.scrollTo(0,0);return;}
  if(t.dataset.period){S.period=t.dataset.period;render();return;}
  if(t.dataset.filter){S.opsFilter=t.dataset.filter;render();return;}
  if(t.dataset.prod){sheetProduct(t.dataset.prod);return;}
  if(t.dataset.party){if(!t.closest("#sheetRoot"))sheetPartyCard(t.dataset.party);return;}
  if(t.dataset.del){const id=t.dataset.del;confirmInline(t,"Удалить?",async()=>{try{await S.db.doc("ops/"+id).delete();toast("Запись удалена");}catch(err){toast("Не удалось удалить");}});return;}
  const a=t.dataset.act;
  if(a==="sale")sheetBulkSale();else if(a==="purchase")sheetBulkPurchase();else if(a==="payment")sheetPayment();else if(a==="expense")sheetExpense();
  else if(a==="party"||a==="newshop")sheetParty(null,"client");else if(a==="newsupplier")sheetParty(null,"supplier");else if(a==="payin")sheetPayment(null,"in");else if(a==="payout")sheetPayment(null,"out");else if(a==="product")sheetProduct();else if(a==="olddebt")sheetOldDebt();else if(a==="cashfix")sheetCashFix();else if(a==="seed")seedProducts();else if(a==="minstock")sheetMinStock();
});
function closeSheetSilently(){$("#sheetRoot").innerHTML="";}
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;const box=$("#plist");if(box)box.innerHTML=partyList(box.dataset.kind);}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#sheetRoot").innerHTML)closeSheet();});
function setSync(cls,text){for(const id of["sync","sync2"]){const el=document.getElementById(id);if(el){el.className="sync "+cls;el.lastElementChild.textContent=text;}}}

// ---------- standalone boot (Firebase) ----------
function loginHTML(){return '<div class="card" style="max-width:420px"><h2 style="font-family:var(--display);font-weight:600;font-size:20px">Вход</h2><form id="loginF"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Пароль<input name="pass" type="password" autocomplete="current-password" required></label><button class="pri" type="submit">Войти</button><span class="hint" id="loginErr"></span></form></div>';}
function importHTML(){return '<div class="card"><h2>Перенос данных</h2><span class="hint">Загрузите файл fairy-baby-data.json, чтобы перенести записи со старого сайта. Записи с тем же номером перезапишутся, дубли не появятся.</span><input type="file" id="impFile" accept=".json,application/json"><span class="hint" id="impMsg"></span><div class="row"><button class="sm" id="exportBtn" type="button">Скачать копию данных</button><button class="sm" id="logout" type="button">Выйти из аккаунта</button></div></div>'+
  '<div class="card alert"><h2>Начать учёт заново</h2><span class="hint" style="color:var(--fg)">Удалит все записи: приходы, выдачи магазинам, оплаты, долги, расходы и деньги. Склад станет пустым. Перед удалением сайт сам скачает копию данных.</span>'+
  '<label class="row" style="flex-direction:row;align-items:center;gap:8px;font-weight:600;color:var(--fg)"><input type="checkbox" id="rsShops" style="width:auto"> Удалить также список магазинов</label>'+
  '<label class="row" style="flex-direction:row;align-items:center;gap:8px;font-weight:600;color:var(--fg)"><input type="checkbox" id="rsProducts" style="width:auto"> Удалить также товары и их цены</label>'+
  '<label>Для подтверждения напишите слово ОБНУЛИТЬ<input id="rsWord" autocomplete="off"></label>'+
  '<button class="danger" id="rsGo" type="button">Скачать копию и обнулить</button><span class="hint" id="rsMsg"></span></div>';}
function downloadBackup(){const data={exportedAt:new Date().toISOString(),products:S.products,parties:S.parties,ops:S.ops};
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:"application/json"}));a.download="fairy-baby-data-"+today()+".json";document.body.appendChild(a);a.click();a.remove();}
document.addEventListener("click",async e=>{if(e.target.id!=="rsGo")return;const msg=$("#rsMsg");
  if(($("#rsWord").value||"").trim().toUpperCase()!=="ОБНУЛИТЬ"){msg.textContent="Напишите слово ОБНУЛИТЬ, чтобы подтвердить.";return;}
  e.target.disabled=true;try{downloadBackup();msg.textContent="Копия скачана. Удаляю…";
    const fs=firebase.firestore();const del=[...S.ops.map(o=>"ops/"+o.id)];
    if($("#rsShops").checked)for(const p of S.parties)if(p.kind!=="supplier")del.push("parties/"+p.id);
    if($("#rsProducts").checked)for(const p of S.products)del.push("products/"+p.id);
    if(!$("#rsShops").checked||!$("#rsProducts").checked){/* keep remembered prices */}
    for(let i=0;i<del.length;i+=400){const b=fs.batch();for(const path of del.slice(i,i+400))b.delete(fs.doc(path));await b.commit();}
    msg.textContent="Готово: удалено записей "+del.length+". Учёт начинается с нуля.";toast("Учёт обнулён");$("#rsWord").value="";}
  catch(err){msg.textContent="Ошибка: "+(err.message||err);}finally{e.target.disabled=false;}});
document.addEventListener("submit",async e=>{if(e.target.id!=="loginF")return;e.preventDefault();const f=e.target;$("#loginErr").textContent="Вхожу…";
  try{await firebase.auth().signInWithEmailAndPassword(f.email.value.trim(),f.pass.value);}catch(err){$("#loginErr").textContent="Не удалось войти: неверный email или пароль.";}});
document.addEventListener("click",e=>{if(e.target.id!=="exportBtn")return;downloadBackup();toast("Копия скачана");});
document.addEventListener("click",e=>{if(e.target.id==="logout")firebase.auth().signOut().then(()=>location.reload());});
document.addEventListener("change",async e=>{if(e.target.id!=="impFile")return;const file=e.target.files[0];if(!file)return;const msg=$("#impMsg");
  try{const data=JSON.parse(await file.text());const fs=firebase.firestore();let n=0,batch=fs.batch(),inBatch=0;
    for(const col of["products","parties","ops"])for(const d of (data[col]||[])){const {id,...rest}=d;batch.set(fs.collection(col).doc(id),rest);n++;inBatch++;if(inBatch>=400){await batch.commit();batch=fs.batch();inBatch=0;}}
    if(inBatch)await batch.commit();msg.textContent="Перенесено записей: "+n;toast("Данные перенесены");}catch(err){msg.textContent="Ошибка: "+(err.message||err);}});
function fsAdapter(fs){return{
  collection:n=>({onSnapshot:(next,err)=>fs.collection(n).onSnapshot(snap=>next({docs:snap.docs.map(d=>({id:d.id,data:()=>d.data()})),metadata:{fromCache:false}}),err),
    add:async d=>{const r=await fs.collection(n).add(d);return{id:r.id};}}),
  doc:path=>{const r=fs.doc(path);return{update:d=>r.update(d),delete:()=>r.delete(),set:d=>r.set(d)};}};}
render();
(function(){
  if(!window.firebase||!window.FB_CONFIG||!window.FB_CONFIG.apiKey){S.error="Firebase не настроен: заполните firebase-config.js.";setSync("err","Нет настройки");render();return;}
  firebase.initializeApp(window.FB_CONFIG);const fs=firebase.firestore();fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  let started=false;
  firebase.auth().onAuthStateChanged(user=>{
    if(!user){S.login=true;S.db=null;setSync("err","Нужно войти");render();return;}
    S.login=false;if(started)return;started=true;S.db=fsAdapter(fs);
    const timer=setTimeout(()=>{if(!(S.loaded.products&&S.loaded.parties&&S.loaded.ops))setSync("err","Нет связи, данные могут быть неполными");},10000);
    const sub=name=>S.db.collection(name).onSnapshot(snap=>{
      S[name]=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded[name]=true;
      if(S.loaded.products&&S.loaded.parties&&S.loaded.ops){clearTimeout(timer);setSync("ok","Сохранено онлайн");}
      if(!$("#sheetRoot").innerHTML)render();
    },err=>{clearTimeout(timer);S.error="Ошибка базы: "+((err&&err.message)||"")+". Проверьте, что вы вошли под своим аккаунтом.";S.db=null;setSync("err","Ошибка");render();});
    sub("products");sub("parties");sub("ops");render();
  });
})();
})();
</script>

</body></html>
