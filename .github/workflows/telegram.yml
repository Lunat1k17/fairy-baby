name: Напоминание в Telegram
# Утреннее сообщение и ответы на команды теперь делает сервер Cloudflare (tools/telegram-worker.js).
# Здесь осталась ручная отправка: Actions → Run workflow.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: telegram-${{ github.event.schedule == '*/5 * * * *' && 'poll' || 'daily' }}
  cancel-in-progress: false
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/tg-remind.mjs
        env:
          FB_EMAIL: ${{ secrets.FB_EMAIL }}
          FB_PASSWORD: ${{ secrets.FB_PASSWORD }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MODE: ${{ github.event.schedule == '*/5 * * * *' && 'poll' || 'daily' }}
